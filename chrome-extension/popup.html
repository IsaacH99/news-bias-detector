<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 380px; font: 13px system-ui, sans-serif; padding: 12px; margin: 0; }
    h3 { margin: 0 0 8px; font-size: 15px; }
    button { padding: 6px 12px; cursor: pointer; }
    #status { color: #666; margin: 8px 0; min-height: 16px; }
    .card { border: 1px solid #ddd; border-radius: 6px; padding: 8px; margin: 6px 0; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-left: 6px; }
    .red { background: #ffd6d6; color: #900; }
    .green { background: #d6ffd6; color: #060; }
    .gray { background: #eee; color: #555; }
    .bias { margin-top: 10px; padding: 6px; border-radius: 6px; background: #f5f5f5; }
    small { color: #666; }
  </style>
</head>
<body>
  <h3>Claim &amp; Bias Checker</h3>
  <button id="go">Analyze this page</button>
  <div id="status"></div>
  <div id="results"></div>
  <script src="popup.js"></script>
</body>
</html>
