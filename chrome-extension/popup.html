<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    /* Reset and Base Styles */
    :root {
      --bg: #f9f9f9;
      --card-bg: #ffffff;
      --text-main: #111111;
      --text-muted: #666666;
      --border: #e5e5e5;
      --green-bg: #e6f4ea;
      --green-text: #137333;
      --red-bg: #fce8e6;
      --red-text: #c5221f;
      --gray-bg: #f1f3f4;
      --gray-text: #3c4043;
      --blue: #0066cc;
    }

    body {
      width: 400px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    /* Header & Button */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    button {
      background-color: var(--text-main);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    button:hover { background-color: #333; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #status {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-align: center;
      min-height: 16px;
    }

    /* Article Header */
    .article-header {
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .article-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 4px;
    }

    .article-source {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }

    .claim-text {
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .badge.red { background: var(--red-bg); color: var(--red-text); }
    .badge.green { background: var(--green-bg); color: var(--green-text); }
    .badge.gray { background: var(--gray-bg); color: var(--gray-text); }

    /* Bias Section */
    .bias-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bias-label {
      font-size: 13px;
      font-weight: 500;
    }

    .bias-score {
      font-size: 12px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .reason {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.4;
      font-style: italic;
    }

    a {
      color: var(--blue);
      text-decoration: none;
      font-size: 12px;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <h3>Claim Check</h3>
    <button id="go">Analyze Page</button>
  </div>
  
  <div id="status"></div>
  <div id="results"></div>
  
  <script src="popup.js"></script>
</body>
</html>
